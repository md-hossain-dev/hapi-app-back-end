{% block content %}

<!-- Delete Confirmation Modal -->
<!-- Modal for Confirm Deletion -->
<div class="modal fade" id="deleteConfirmationModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteConfirmationModalLabel">Confirm Deletion</h5>
                <!-- Close Button (×) Removed -->
            </div>
            <div class="modal-body">
                Are you sure you want to delete this Store Product?
            </div>
            <div class="modal-footer">
                <!-- No Button to Close Modal -->
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <!-- Yes Button to Confirm Deletion -->
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Yes</button>
            </div>
        </div>
    </div>
</div>





</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">

<!-- Toastr JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>


<script type="application/javascript">

   function deleteStore(storeId) {
    // Show the confirmation modal
    $('#deleteConfirmationModal').modal('show');

    // Attach the click event to the "Yes" button dynamically
    const confirmDeleteHandler = function() {

        const jwtToken = localStorage.getItem("jwtToken");


        if (!jwtToken) {
            toastr.error('Authentication token not found. Please log in again.', 'Error');
            $('#deleteConfirmationModal').modal('hide');
            return;
        }

        // Proceed with the deletion after user clicks "Yes"
        axios.delete(`http://127.0.0.1:8000/store/delete/${storeId}/`, {
            headers: {
                "X-CSRFToken": "{{ csrf_token }}", // CSRF Token
                "Authorization": `Bearer ${jwtToken}` // JWT Token from localStorage
            }
        })
        .then(response => {
            const data = response.data; // Axios automatically parses the JSON
            if (data.message) {
                toastr.success(data.message, 'Success');
                $('#id_table_blog').DataTable().ajax.reload(); // Reload the table
            } else {
                toastr.error(data.error || "An error occurred!", 'Error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            toastr.error(error.response?.data?.detail || 'Something went wrong!', 'Error');
        })
        .finally(() => {
            // Close the modal after the operation
            $('#deleteConfirmationModal').modal('hide');
        });
    };

        // Bind the "Yes" button event
        $('#confirmDeleteBtn').one('click', confirmDeleteHandler);

        // The "No" button will close the modal
        $('#deleteConfirmationModal').on('click', '.btn-secondary', function() {
            $('#deleteConfirmationModal').modal('hide');
        });

        // Ensure all event handlers are cleaned up after the modal is closed
        $('#deleteConfirmationModal').on('hidden.bs.modal', function() {
            $('#confirmDeleteBtn').off('click', confirmDeleteHandler);
        });
    }



    

    function singleStore(storeId) {
    if (storeId == null) {
        console.error("Invalid store  ID");
        return;
    }

    // Clear previous modal content
    $('#user_details_modal_data').empty();

    // Get the JWT token from localStorage
    const jwtToken = localStorage.getItem("jwtToken");
    console.log("JWT Token inside singleStore: ", jwtToken);  // Check the token

    // Check if token is present
    if (!jwtToken) {
        console.error("JWT Token is missing or invalid");
        toastr.error("JWT Token is missing or invalid", "Error");
        return;
    }

    // API call to fetch the store details
    axios.get(`http://127.0.0.1:8000/product/${storeId}/`, {
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",  // CSRF Token
            "Authorization": `Bearer ${jwtToken}`  // Attach JWT Token as Bearer token
        }
    })
    .then((result) => {
        const store = result?.data;
        console.log("store details: ", store);  // Check if data is returned correctly

        // Update modal content with store data
        $('#user_details_modal_data').append(` 
            <div class="model_data">
                <h5 class="model_data_title"><b>Name: </b> ${store.name}</h5>
                <div><b>Description: </b> ${store.description}</div>
                <div><b>Day: </b> ${store.day}</div>
                <div><b>Star: </b> ${store.star}</div>
                <div><b>Price: </b> ${store.price}</div>
                <div><b>Category: </b> ${store.category.name}</div>
                <div><b>Active: </b> ${store.is_active ? 'Yes' : 'No'}</div>
                
            </div>
        `);

        // Show the modal
        const modal = new bootstrap.Modal(document.getElementById('user_details_modal'));
        modal.show();
    })
    .catch((error) => {
        toastr.error('Error fetching User information');
        console.error('Error fetching User information:', error);
    });
}




    // Initialize the DataTable and load data
    function initializeDataTable() {
        const loadingData = document.getElementById("id_loading_data");

        $("#id_table_blog").DataTable({
            paging: true,
            destroy: true,
            pageLength: 10,
            serverSide: true,
            ajax: {
                url: `http://127.0.0.1:8000/store-lists`,
                type: "GET",
                data: function (data) {
                    const page = Math.floor(data?.start / data?.length) + 1;
                    const size = data?.length;
                    const searchQuery = data?.search?.value; 
                    return { page, size, q: searchQuery };
                },
                dataSrc: function (apiResponse) {
                    const dataUserShow = [];
                    const recordsTotal = apiResponse?.count;

                    $.extend(apiResponse, {
                        recordsTotal,
                        recordsFiltered: recordsTotal
                    });

                    apiResponse?.results?.data.forEach(d => {
                        dataUserShow.push([ 
                            d.id || "",
                            d.name || "",
                            d.category || "",
                            d.description || "",
                            d.day || "",
                            d.star || "",
                            d.price || "",
                            d.is_active || "",
                            `<div class="td-container d-flex justify-content-around">
                                <a class="btn btn-sm btn-primary" href="javascript:void(0)" onclick="singleStore(${d?.id})">
                                    <i class="fa fa-eye"></i>
                                </a>

                                <a class="btn btn-sm btn-danger" href="javascript:void(0)" onclick="deleteStore(${d?.id})">
                                    <i class="fa fa-trash"></i>
                                </a>

                                <a class="btn btn-sm btn-secondary" href="{% url 'store_edit' %}?id_store=${d.id}">
                                  <i class="fa fa-edit"></i> 
                                </a>
                            </div>`
                        ]);
                    });

                    loadingData.style.display = "none";
                    return dataUserShow;
                },
                beforeSend: function (request) {
                    const jwtToken = localStorage.getItem("jwtToken");
                    if (jwtToken) {
                        // Adding Authorization header with JWT token
                        request.setRequestHeader("Authorization", `Bearer ${jwtToken}`);
                    }
                    request.setRequestHeader("X-CSRFToken", "{{ csrf_token }}"); // CSRF token header
                    loadingData.style.display = "flex";
                },
                error: function (jqXhr, textStatus, errorThrown) {
                    loadingData.style.display = "none";
                    console.error("Error:", errorThrown);
                }
            },
            columns: [
                { title: "ID" },
                { title: "Name" },
                { title: "Category" },
                { title: "Description" },
                { title: "Day" },
                { title: "Star" },
                { title: "Price" },
                { title: "is_active" },
                { title: "Actions", orderable: false }
            ],
            order: [[0, 'desc']],
            language: {
                search: "Search by Name",
                lengthMenu: "_MENU_",
                info: "Showing _START_ to _END_ of _TOTAL_ entries"
            }
        });
    }

    $(document).ready(function() {
        initializeDataTable(); // Initialize DataTable on page load
    });
</script>



<script type="application/javascript">
    function updateDateTime() {
        const currentDate = new Date();
        const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const monthsOfYear = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        const day = daysOfWeek[currentDate.getDay()];
        const month = monthsOfYear[currentDate.getMonth()];
        const date = currentDate.getDate();
        const year = currentDate.getFullYear();

        const hours = currentDate.getHours();
        const minutes = currentDate.getMinutes();
        const seconds = currentDate.getSeconds();

        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedHours = hours % 12 || 12;  // 12-hour format
        const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
        const formattedSeconds = seconds < 10 ? '0' + seconds : seconds;

        const dateTimeString = `${day} · ${month} ${date}, ${year} · ${formattedHours}:${formattedMinutes}:${formattedSeconds} ${ampm} GMT+5`;

        document.getElementById("date-time").innerText = dateTimeString;
    }

    setInterval(updateDateTime, 1000);

    updateDateTime();
</script>

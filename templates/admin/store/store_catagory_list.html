<script type="application/javascript">
    // Function to delete user by userId
    // Function to delete user by userId
    function deleteUser(userId) {
        // Show the confirmation modal
        $('#deleteConfirmationModal').modal('show');

        // Bind the click event to the "Yes" button in the modal
        $('#confirmDeleteBtn').on('click', function() {
            const jwtToken = localStorage.getItem("jwtToken");
            // Proceed with the deletion after user clicks "Yes"
            axios.delete(`http://127.0.0.1:8000/delete-user/${userId}/`, {
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}", // CSRF Token
                    "Authorization": `Bearer ${jwtToken}` // JWT Token from localStorage
                }
            })
            .then(response => {
                const data = response.data;  // Axios automatically parses the JSON
                if (data.message) {
                    // Show success message using Toastr
                    toastr.success(data.message, 'Success');
                    $('#id_table_blog').DataTable().ajax.reload();
                    // Optionally, remove the deleted user row from the UI
                } else {
                    // Show error message using Toastr
                    toastr.error(data.error || "An error occurred!", 'Error');
                }

                // Close the modal after deletion
                $('#deleteConfirmationModal').modal('hide');
            })
            .catch(error => {
                console.error('Error:', error);
                // Show error message using Toastr
                toastr.error('Something went wrong!', 'Error');

                // Close the modal in case of error
                $('#deleteConfirmationModal').modal('hide');
            });
        });

        // The "No" button will close the modal
        $('#deleteConfirmationModal').on('click', '.btn-secondary', function() {
            // Close the modal when the user clicks "No"
            $('#deleteConfirmationModal').modal('hide');
        });

        // Reset the event handler for "Yes" button to avoid multiple bindings
        $('#deleteConfirmationModal').on('hidden.bs.modal', function() {
            $('#confirmDeleteBtn').off('click');
        });
    }


    

    function singleUser(userId) {
    if (userId == null) {
        console.error("Invalid user ID");
        return;
    }

    // Clear previous modal content
    $('#user_details_modal_data').empty();

    // Get the JWT token from localStorage
    const jwtToken = localStorage.getItem("jwtToken");
    console.log("JWT Token inside singleUser: ", jwtToken);  // Check the token

    // Check if token is present
    if (!jwtToken) {
        console.error("JWT Token is missing or invalid");
        toastr.error("JWT Token is missing or invalid", "Error");
        return;
    }

    // API call to fetch the user details
    axios.put(`http://127.0.0.1:8000/user-update/${userId}/`, {
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",  // CSRF Token
            "Authorization": `Bearer ${jwtToken}`  // Attach JWT Token as Bearer token
        }
    })
    .then((result) => {
        const user = result?.data?.data;
        console.log("User details: ", user);  // Check if data is returned correctly

        // Update modal content with user data
        $('#user_details_modal_data').append(` 
            <div class="model_data">
                <h5 class="model_data_title"><b>Email: </b> ${user.email}</h5>
                <div><b>User Name: </b> ${user.username}</div>
                <div><b>First Name: </b> ${user.first_name}</div>
                <div><b>Last Name: </b> ${user.last_name}</div>
                <div><b>Bio: </b> ${user.bio}</div>
                <div><b>Nick Name: </b> ${user.nick_name}</div>
                <div><b>Gender: </b> ${user.gender}</div>
                <div><b>Birth Day: </b> ${user.birth_day}</div>
                <div><b>Phone Number: </b> ${user.phone_number}</div>
                <div><b>Active: </b> ${user.is_active ? 'Yes' : 'No'}</div>
                <div><b>Vip: </b> ${user.is_svip ? 'Yes' : 'No'}</div>
                <div><b>Level: </b> ${user.level}</div>
                <div><b>Country: </b> ${user.country}</div>
            </div>
        `);

        // Show the modal
        const modal = new bootstrap.Modal(document.getElementById('user_details_modal'));
        modal.show();
    })
    .catch((error) => {
        toastr.error('Error fetching User information');
        console.error('Error fetching User information:', error);
    });
}




    // Initialize the DataTable and load data
    function initializeDataTable() {
        const loadingData = document.getElementById("id_loading_data");

        $("#id_table_blog").DataTable({
            paging: true,
            destroy: true,
            pageLength: 5,
            serverSide: true,
            ajax: {
                url: `http://127.0.0.1:8000/category-lists-store`,
                type: "GET",
                data: function (data) {
                    const page = Math.floor(data?.start / data?.length) + 1;
                    const size = data?.length;
                    const searchQuery = data?.search?.value; 
                    return { page, size, q: searchQuery };
                },
                dataSrc: function (apiResponse) {
                    const dataUserShow = [];
                    const recordsTotal = apiResponse?.count;

                    $.extend(apiResponse, {
                        recordsTotal,
                        recordsFiltered: recordsTotal
                    });

                    apiResponse?.results?.data.forEach(d => {
                        dataUserShow.push([ 
                            d.id || "",
                            d.name || "",
                            d.created_at || "",
                            d.updated_at || "",
                            d.is_active || "",
                            `<div class="td-container d-flex justify-content-around">
                                <a class="btn btn-sm btn-primary" href="javascript:void(0)" onclick="singleUser(${d?.id})">
                                    <i class="fa fa-eye"></i>
                                </a>

                                <a class="btn btn-sm btn-danger" href="javascript:void(0)" onclick="deleteUser(${d?.id})">
                                    <i class="fa fa-trash"></i>
                                </a>

                                <a class="btn btn-sm btn-secondary" href="{% url 'user_edit' %}?id_user=${d.id}">
                                  <i class="fa fa-edit"></i> 
                                </a>
                            </div>`
                        ]);
                    });

                    loadingData.style.display = "none";
                    return dataUserShow;
                },
                beforeSend: function (request) {
                    const jwtToken = localStorage.getItem("jwtToken");
                    if (jwtToken) {
                        // Adding Authorization header with JWT token
                        request.setRequestHeader("Authorization", `Bearer ${jwtToken}`);
                    }
                    request.setRequestHeader("X-CSRFToken", "{{ csrf_token }}"); // CSRF token header
                    loadingData.style.display = "flex";
                },
                error: function (jqXhr, textStatus, errorThrown) {
                    loadingData.style.display = "none";
                    console.error("Error:", errorThrown);
                }
            },
            columns: [
                { title: "ID" },
                { title: "Name" },
                { title: "Created At" },
                { title: "Updated At" },
                { title: "is_active" },
                { title: "Actions", orderable: false }
            ],
            order: [[0, 'desc']],
            language: {
                search: "Search by Name",
                lengthMenu: "_MENU_",
                info: "Showing _START_ to _END_ of _TOTAL_ entries"
            }
        });
    }

    $(document).ready(function() {
        initializeDataTable(); // Initialize DataTable on page load
    });
</script>



<script type="application/javascript">
    function updateDateTime() {
        const currentDate = new Date();
        const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const monthsOfYear = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        const day = daysOfWeek[currentDate.getDay()];
        const month = monthsOfYear[currentDate.getMonth()];
        const date = currentDate.getDate();
        const year = currentDate.getFullYear();

        const hours = currentDate.getHours();
        const minutes = currentDate.getMinutes();
        const seconds = currentDate.getSeconds();

        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedHours = hours % 12 || 12;  // 12-hour format
        const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
        const formattedSeconds = seconds < 10 ? '0' + seconds : seconds;

        const dateTimeString = `${day} · ${month} ${date}, ${year} · ${formattedHours}:${formattedMinutes}:${formattedSeconds} ${ampm} GMT+5`;

        document.getElementById("date-time").innerText = dateTimeString;
    }

    setInterval(updateDateTime, 1000);

    updateDateTime();
</script>
